name: GrowFarm
main: xyz.naxho.growfarm.Main
version: 1.0.0
api-version: '1.21'
description: GrowFarm automatically grows crops/trees and plants seeds for players, with WorldGuard region support.
author: elnaxho
softdepend: [WorldGuard, FastAsyncWorldEdit, LuckPerms]

commands:
  grow:
    description: Toggle AutoGrow (Sneak + Move), or a specific mode.
    aliases: [growfarm]
    usage: /grow [sneak|move|reload]
  plant:
    description: Toggle AutoPlant.
    usage: /plant

permissions:
  growfarm.*:
    description: Grants every GrowFarm permission.
    default: false
    children:
      growfarm.command.grow: true
      growfarm.command.grow.sneak: true
      growfarm.command.grow.move: true
      growfarm.command.plant: true
      growfarm.command.reload: true
      growfarm.feature.autogrow: true
      growfarm.feature.autogrow.move: true
      growfarm.feature.autogrow.sneak: true
      growfarm.feature.autoplant: true

  # --- Commands ---
  growfarm.command.grow:
    description: Allows using /grow to toggle both Sneak Grow and Move Grow together.
    default: true
  growfarm.command.grow.sneak:
    description: Allows using /grow sneak.
    default: true
  growfarm.command.grow.move:
    description: Allows using /grow move.
    default: true
  growfarm.command.plant:
    description: Allows using /plant to toggle AutoPlant.
    default: true
  growfarm.command.reload:
    description: Allows reloading the GrowFarm configuration with /grow reload.
    default: op

  # --- Features ---
  growfarm.feature.autogrow:
    description: Allows using AutoGrow at all (required alongside the sneak/move-specific nodes below).
    default: true
  growfarm.feature.autogrow.move:
    description: Allows AutoGrow to trigger from movement (crops only, never saplings).
    default: true
  growfarm.feature.autogrow.sneak:
    description: Allows AutoGrow to trigger while sneaking (crops and saplings).
    default: true
  growfarm.feature.autoplant:
    description: Allows using AutoPlant.
    default: true
