# GrowFarm Configuration


# ╔══════════════════════════════════════════════╗
# ║ Dependencies                                 ║
# ╚══════════════════════════════════════════════╝

worldguard:
  # Respect the custom "autogrow" and "autoplant" WorldGuard flags.
  enabled: true

luckperms:
  # Use LuckPerms for permission checks when installed.
  enabled: true


# ╔══════════════════════════════════════════════╗
# ║ General                                     ║
# ╚══════════════════════════════════════════════╝

general:
  # Prevent AutoGrow and AutoPlant from being enabled
  # at the same time.
  #
  # true  = enabling one automatically disables the other
  # false = AutoGrow and AutoPlant can both be enabled
  exclusive-mode: true


# ╔══════════════════════════════════════════════╗
# ║ Farmland                                    ║
# ╚══════════════════════════════════════════════╝

farmlands:

  # Enable/disable the entire farmland system.
  enabled: true


  # ────────────────────────────────────────────
  # AutoGrow
  # ────────────────────────────────────────────

  autogrow:

    # Enable AutoGrow for farmland.
    enabled: true

    # Area around the player that is scanned.
    #
    # 1 = player's block only
    # N = sphere with a radius of N - 1 blocks
    area: 4

    # Percentage chance for each eligible block to grow.
    # Range: 0-100
    growth-chance: 50

    # true  = grow exactly one stage
    # false = instantly grow to maximum stage
    stage-growing: true

    # Require bone meal in the player's inventory.
    # One bone meal is consumed when something grows.
    bone-meal-use: true

    # Require the player to have a hoe.
    hoe-use: false


    # ──────────────────────────────────────────
    # Custom Item Requirement
    # ──────────────────────────────────────────

    custom-item-use: false

    # Items that can be used as the custom requirement.
    #
    # Format:
    #   item: amount
    #
    # The amount is the amount required per trigger.
    # All items are consumed simultaneously.
    custom-item-list:
      BONE_MEAL: 32
      GOLD_ORE: 1
      DIAMOND_ORE: 2


    # ──────────────────────────────────────────
    # Crops
    # ──────────────────────────────────────────

    crops:
      WHEAT: true
      CARROTS: true
      POTATOES: true
      BEETROOTS: true
      SUGAR_CANE: true
      COCOA: true
      MELON_STEM: true
      PUMPKIN_STEM: true
      ATTACHED_MELON_STEM: true
      ATTACHED_PUMPKIN_STEM: true
      PITCHER_CROP: true
      TORCHFLOWER_CROP: true
      BAMBOO: true


  # ────────────────────────────────────────────
  # AutoPlant
  # ────────────────────────────────────────────

  autoplant:

    # Enable AutoPlant for farmland.
    enabled: true

    # Area around the player that is scanned.
    area: 4

    # Enable planting on farmland.
    plant: true

    # Seeds/items used for planting.
    #
    # The first available item in the player's
    # inventory is used.
    farmland-seeds:
      - WHEAT_SEEDS
      - BEETROOT_SEEDS
      - CARROT
      - POTATO
      - PITCHER_POD
      - TORCHFLOWER_SEEDS



# ╔══════════════════════════════════════════════╗
# ║ Netherland                                  ║
# ╚══════════════════════════════════════════════╝

netherland:

  # Enable/disable the entire Netherland system.
  enabled: true


  # ────────────────────────────────────────────
  # AutoGrow
  # ────────────────────────────────────────────

  autogrow:

    # Enable AutoGrow for Netherland.
    enabled: true

    area: 4

    # Percentage chance for each eligible block to grow.
    growth-chance: 50

    # true  = one growth stage
    # false = maximum growth stage
    stage-growing: true

    # Require bone meal.
    bone-meal-use: false

    # Require a hoe.
    hoe-use: false


    # ──────────────────────────────────────────
    # Custom Item Requirement
    # ──────────────────────────────────────────

    custom-item-use: false

    custom-item-list:
      BONE_MEAL: 32
      GOLD_ORE: 1
      DIAMOND_ORE: 2


    # ──────────────────────────────────────────
    # Crops
    # ──────────────────────────────────────────

    crops:
      NETHER_WART: true


  # ────────────────────────────────────────────
  # AutoPlant
  # ────────────────────────────────────────────

  autoplant:

    enabled: true

    area: 4

    plant: true

    soul-sand-seeds:
      - NETHER_WART



# ╔══════════════════════════════════════════════╗
# ║ Saplings                                    ║
# ╚══════════════════════════════════════════════╝

saplings:

  # Enable/disable the entire sapling system.
  enabled: true

  # true  = saplings grow immediately when triggered
  # false = saplings use the configured growth-chance
  #        and normal growth behavior.
  insta-saplings: true

  # Percentage chance for a sapling to grow.
  # Only applies when insta-saplings is false.
  growth-chance: 50

  # Require bone meal.
  bone-meal-use: false

  # Require a hoe.
  hoe-use: false


  # ────────────────────────────────────────────
  # Custom Item Requirement
  # ────────────────────────────────────────────

  custom-item-use: false

  custom-item-list:
    BONE_MEAL: 32
    GOLD_ORE: 1
    DIAMOND_BLOCK: 64


  # ────────────────────────────────────────────
  # Individual Saplings
  # ────────────────────────────────────────────
  #
  # true  = enabled
  # false = disabled

  sapling-types:
    OAK: true
    SPRUCE: true
    BIRCH: true
    JUNGLE: true
    ACACIA: true
    DARK_OAK: true
    CHERRY: true
    MANGROVE: true



# ╔══════════════════════════════════════════════╗
# ║ Messages                                    ║
# ╚══════════════════════════════════════════════╝

messages:

  no-bone-meal: "&cYou don't have enough bone meal to grow the crops."
  no-hoe: "&cYou need a hoe to grow the crops."
  # %items% is replaced with the actual required items/amounts from
  # custom-item-list for whichever section triggered it (farmland,
  # netherland, or saplings), e.g. "x32 Bone Meal, x1 Gold Ore".
  no-custom-items: "&cYou need %items% to grow the crops."

  grow-both-on: "&aAutoGrow enabled (Sneak + Move)."
  grow-both-off: "&cAutoGrow disabled (Sneak + Move)."

  grow-sneak-on: "&aSneak Grow enabled."
  grow-sneak-off: "&cSneak Grow disabled."

  grow-move-on: "&aMove Grow enabled."
  grow-move-off: "&cMove Grow disabled."

  plant-on: "&aAutoPlant enabled."
  plant-off: "&cAutoPlant disabled."

  # Used when exclusive-mode is enabled.
  autogrow-disabled-by-autoplant: "&cAutoGrow was disabled because AutoPlant is enabled."
  autoplant-disabled-by-autogrow: "&cAutoPlant was disabled because AutoGrow is enabled."

  reload-success: "&aConfiguration reloaded successfully."

  no-permission: "&cYou don't have permission to do this."
  players-only: "&cThis command can only be used by a player."


# ╔══════════════════════════════════════════════╗
# ║ Debug                                       ║
# ╚══════════════════════════════════════════════╝

# Enable detailed debug information in the console.
debug: false
